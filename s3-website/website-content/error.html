<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - My Website</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .error-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            text-align: center;
            padding: 2rem;
        }
        .error-code {
            font-size: 6rem;
            font-weight: bold;
            color: #e74c3c;
            margin-bottom: 1rem;
        }
        .error-message {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            color: #666;
        }
        .back-button {
            background-color: #3498db;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .back-button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <h1>My Website</h1>
            </div>
        </nav>
    </header>

    <main>
        <div class="error-page">
            <div class="error-code">404</div>
            <div class="error-message">
                <h2>Oops! Page Not Found</h2>
                <p>The page you're looking for doesn't exist or has been moved.</p>
            </div>
            <a href="./index.html" class="back-button">Go Back Home</a>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 My Website. Powered by AWS and Terraform.</p>
        </div>
    </footer>
</body>
</html>
