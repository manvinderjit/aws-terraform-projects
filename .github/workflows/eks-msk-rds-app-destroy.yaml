name: Destroy EKS MSK RDS App Infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: 'Type "DESTROY" to confirm deletion of all resources'
        required: true
        type: string

# These permissions are needed to interact with GitHub's OIDC Token endpoint.
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_TFSTATE_REGION: ${{ secrets.AWS_TFSTATE_REGION }}
  AWS_TFSTATE_LOCK_TABLE_NAME: ${{ secrets.AWS_TFSTATE_LOCK_TABLE_NAME }}

jobs:
  destroy-infrastructure:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm_destroy == 'DESTROY'
    defaults:
      run:
        shell: bash
        working-directory: eks-msk-rds-app

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_GITHUB_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"

      - name: Terraform Init
        id: init
        env:
          AWS_TFSTATE_BUCKET_KEY_NAME: ${{ secrets.AWS_TFSTATE_BUCKET_KEY_NAME }}
          AWS_TFSTATE_BUCKET_NAME: ${{ secrets.AWS_TFSTATE_BUCKET_NAME }}
        run: terraform init -backend-config="bucket=${AWS_TFSTATE_BUCKET_NAME}" -backend-config="key=eks-msk-rds-app/${AWS_TFSTATE_BUCKET_KEY_NAME}" -backend-config="region=${AWS_TFSTATE_REGION}" -backend-config="dynamodb_table=${AWS_TFSTATE_LOCK_TABLE_NAME}"

      - name: Terraform Plan Destroy
        id: plan_destroy
        run: |
          terraform plan -destroy -out=destroy.tfplan -no-color \
            -var="db_name=${{ secrets.AWS_THREE_TIER_RDS_DB_NAME }}" \
            -var="db_username=${{ secrets.AWS_THREE_TIER_RDS_DB_USER_NAME }}" \
            -var="db_password=${{ secrets.AWS_THREE_TIER_RDS_DB_PASSWORD }}"

      - name: Show Destroy Plan
        run: |
          echo "=== Resources to be DESTROYED ==="
          terraform show -no-color destroy.tfplan

      - name: Terraform Destroy
        id: destroy
        run: |
          echo "DESTROYING ALL INFRASTRUCTURE"
          terraform apply -auto-approve destroy.tfplan

      - name: Verify Destruction
        id: verify
        run: |
          echo "=== Destruction Complete ==="
          echo "All EKS MSK RDS App resources have been destroyed"
          echo "AWS charges should stop within the hour"
          echo "Check AWS Console to verify resource cleanup"

  destroy-failed:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm_destroy != 'DESTROY'
    steps:
      - name: Destroy Cancelled
        run: |
          echo "DESTROY CANCELLED"
          echo "You must type 'DESTROY' exactly to confirm resource deletion"
          echo "Current input: '${{ github.event.inputs.confirm_destroy }}'"
          exit 1