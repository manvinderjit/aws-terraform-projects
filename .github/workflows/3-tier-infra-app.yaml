name: Deploy a 3-tier app and infrastructure

on:
  push:
    paths:
      - '3-tier-infra-app/**'
    branches:
      - project/3-tier-infra-app 

  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform Action'
        required: true
        default: 'apply'
        type: choice
        options:
          - apply
          - destroy

# These permissions are needed to interact with GitHub's OIDC Token endpoint.
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}  

jobs:
  deploy-base-infra-rds:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: 3-tier-infra-app/base-infra-rds
    outputs:
      ami_id_backend: ${{ steps.get_backend_ami_id.outputs.ami_id_backend }}

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_GITHUB_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}     
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"

      - name: Terraform Format
        id: fmt
        if: ${{ github.event_name == 'push' || github.event.inputs.action == 'apply' }}
        run: terraform fmt -check
        continue-on-error: true
        
      - name: Terraform Init
        id: init        
        env:
          AWS_TFSTATE_BUCKET_KEY_NAME : ${{ secrets.AWS_TFSTATE_BUCKET_KEY_NAME }}
          AWS_TFSTATE_BUCKET_NAME: ${{ secrets.AWS_TFSTATE_BUCKET_NAME }}
        run: terraform init -backend-config="bucket=${AWS_TFSTATE_BUCKET_NAME}" -backend-config="key=3-tier-infra-app/${AWS_TFSTATE_BUCKET_KEY_NAME}" -backend-config="region=${AWS_TFSTATE_REGION}" -backend-config="dynamodb_table=${AWS_TFSTATE_LOCK_TABLE_NAME}"
        
      - name: Terraform Validate
        id: validate
        if: ${{ github.event_name == 'push' || github.event.inputs.action == 'apply' }}
        run: terraform validate -no-color
      
      - name: Terraform Plan
        id: plan
        if: ${{ github.event_name == 'push' || github.event.inputs.action == 'apply' }}
        run: terraform plan -out=basetfplan -no-color -var="ec2_ami_id=${{ env.AMI_ID }}" -var="db_name=${{ secrets.AWS_THREE_TIER_RDS_DB_NAME }}" -var="db_username=${{ secrets.AWS_THREE_TIER_RDS_DB_USER_NAME }}" -var="db_password=${{ secrets.AWS_THREE_TIER_RDS_DB_PASSWORD }}"

      - name: Terraform Apply
        id: apply
        if: ${{ github.event_name == 'push' || github.event.inputs.action == 'apply' }}
        run: terraform apply -auto-approve basetfplan

      - name: Get RDS endpoint
        id: rds_endpoint
        run: |
          RDS_ENDPOINT=$(terraform output -raw rds_endpoint)
          echo "RDS_ENDPOINT=$RDS_ENDPOINT" >> $GITHUB_ENV

      - name: Print RDS Endpoint
        run: echo "RDS Endpoint is $RDS_ENDPOINT"
        env:
          RDS_ENDPOINT: ${{ env.RDS_ENDPOINT }}

      - name: Get Backend ALB DNS
        id: get_backend_alb_dns
        run: |
          PRIVATE_ALB_DNS=$(terraform output -raw private_alb_dns)
          echo "PRIVATE_ALB_DNS=$PRIVATE_ALB_DNS" >> $GITHUB_ENV

      - name: Print Backend ALB Endpoint
        run: echo "Api ALB Endpoint is $PRIVATE_ALB_DNS"
        env:
          PRIVATE_ALB_DNS: ${{ env.PRIVATE_ALB_DNS }}

      - name: Setup Packer
        uses: hashicorp/setup-packer@v2
        with:
          version: '1.10.0'

