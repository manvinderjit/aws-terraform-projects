name: Deploy a 3-tier EKS MSK RDS Infra and App

on:
  push:
    paths:
      - "eks-msk-rds-app/**"
    branches:
      - project/eks-msk-rds-app

  workflow_dispatch:

# These permissions are needed to interact with GitHub's OIDC Token endpoint.
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_TFSTATE_REGION: ${{ secrets.AWS_TFSTATE_REGION }}

jobs:
  deploy-infrastructure-and-apps:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: eks-msk-rds-app

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_GITHUB_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"

      - name: Terraform Format
        id: fmt
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Init
        id: init
        env:
          AWS_TFSTATE_BUCKET_KEY_NAME: ${{ secrets.AWS_TFSTATE_BUCKET_KEY_NAME }}
          AWS_TFSTATE_BUCKET_NAME: ${{ secrets.AWS_TFSTATE_BUCKET_NAME }}
        run: terraform init -backend-config="bucket=${AWS_TFSTATE_BUCKET_NAME}" -backend-config="key=eks-msk-rds-app/${AWS_TFSTATE_BUCKET_KEY_NAME}" -backend-config="region=${AWS_TFSTATE_REGION}"

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: terraform plan -out=tfplan -no-color -var="eks_admin_user_arn=${{ secrets.EKS_ADMIN_USER_ARN }}" -var="github_actions_role_arn=${{ secrets.AWS_TERRAFORM_GITHUB_ROLE }}" -var="db_name=${{ secrets.AWS_THREE_TIER_RDS_DB_NAME }}" -var="db_username=${{ secrets.AWS_THREE_TIER_RDS_DB_USER_NAME }}" -var="db_password=${{ secrets.AWS_THREE_TIER_RDS_DB_PASSWORD }}"

      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve tfplan

      - name: Get Terraform Outputs
        id: terraform_outputs
        run: |
          echo "Getting Terraform outputs..."
          MSK_BOOTSTRAP_BROKERS=$(terraform output -raw msk_bootstrap_brokers)
          RDS_ENDPOINT=$(terraform output -raw db_instance_endpoint | cut -d: -f1)
          RDS_PORT=$(terraform output -raw db_instance_port)

          echo "MSK_BOOTSTRAP_BROKERS=$MSK_BOOTSTRAP_BROKERS" >> $GITHUB_ENV
          echo "RDS_ENDPOINT=$RDS_ENDPOINT" >> $GITHUB_ENV
          echo "RDS_PORT=$RDS_PORT" >> $GITHUB_ENV
          echo "DB_NAME=${{ secrets.AWS_THREE_TIER_RDS_DB_NAME }}" >> $GITHUB_ENV
          echo "DB_USERNAME=${{ secrets.AWS_THREE_TIER_RDS_DB_USER_NAME }}" >> $GITHUB_ENV
          echo "DB_PASSWORD=${{ secrets.AWS_THREE_TIER_RDS_DB_PASSWORD }}" >> $GITHUB_ENV

          echo "Terraform outputs captured"

      - name: Debug AWS and EKS Access
        id: debug_aws
        run: |
          echo "=== AWS Debug Information ==="
          echo "Current AWS Identity:"
          aws sts get-caller-identity
          
          echo "AWS Region: ${{ env.AWS_REGION }}"
          echo "Available EKS clusters in region:"
          aws eks list-clusters --region ${{ env.AWS_REGION }}
          
          echo "Checking specific cluster:"
          aws eks describe-cluster --name eks-msk-rds-app-cluster --region ${{ env.AWS_REGION }} || echo "Cluster not found in this region"
          
          echo "Checking access entries:"
          aws eks list-access-entries --cluster-name eks-msk-rds-app-cluster --region ${{ env.AWS_REGION }} || echo "Cannot list access entries"

      - name: Configure kubectl
        id: configure_kubectl
        run: |
          echo "Configuring kubectl for EKS cluster..."
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name eks-msk-rds-app-cluster
          kubectl cluster-info
          echo "kubectl configured"

      - name: Deploy Kubernetes Applications
        id: deploy_k8s
        run: |
          echo "Deploying Kubernetes Applications..."

          # Create base64 encoded password for secrets
          DB_PASSWORD_BASE64=$(echo -n "${{ secrets.AWS_THREE_TIER_RDS_DB_PASSWORD }}" | base64 -w 0)

          echo "Deploying ConfigMaps and Secrets..."

          # Deploy backend ConfigMap
          echo "Deploying backend ConfigMap..."
          envsubst < k8-manifests/backend/configmap.yaml | kubectl apply -f -

          # Deploy backend Secrets
          echo "Deploying backend Secrets..."
          DB_PASSWORD_BASE64=$DB_PASSWORD_BASE64 envsubst < k8-manifests/backend/secrets.yaml | kubectl apply -f -

          # Deploy frontend ConfigMap
          echo "Deploying frontend ConfigMap..."
          envsubst < k8-manifests/frontend/configmap.yaml | kubectl apply -f -

          echo "Deploying Applications..."

          # Deploy backend application
          echo "Deploying backend application..."
          kubectl apply -f k8-manifests/backend/1-deployment-backend.yaml
          kubectl apply -f k8-manifests/backend/2-svc-cluster-backend.yaml

          # Deploy frontend application
          echo "Deploying frontend application..."
          kubectl apply -f k8-manifests/frontend/1-deployment-frontend.yaml
          kubectl apply -f k8-manifests/frontend/2-2-svc-cluster-frontend.yaml

          echo "Waiting for deployments to be ready..."

          # Wait for deployments to be ready
          kubectl rollout status deployment/deployment-kafka-project-backend --timeout=300s
          kubectl rollout status deployment/deployment-kafka-project-frontend --timeout=300s

          echo "Kubernetes applications deployed successfully!"

          # Show deployment status
          echo "Deployment Status:"
          kubectl get pods -l app=kafka-project-backend
          kubectl get pods -l app=kafka-project-frontend
          kubectl get services

          echo "Deployment completed!"
