spring.application.name=frontend

# Kafka (MSK)
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:http://localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Backend API URL
backend.api.url=${BACKEND_API_URL:http://localhost:8080/api/events}

# Actuator endpoints for monitoring
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# Custom application metrics
management.metrics.tags.application=kafka-project-frontend
management.metrics.tags.service=frontend

# Server port
server.port=8081